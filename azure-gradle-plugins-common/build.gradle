ext {
    projectShortName = "azure-gradle-plugins-common"
    projectName = "Common Lib for Azure Gradle Plugins"
    projectDescription = "A common lib for sharing code among azure gradle plugins"
}

dependencies {
    implementation gradleApi()

    implementation libs.commons.io
    implementation libs.apache.commons.lang3
    implementation libs.google.guava
    implementation libs.slf4j.api
    implementation libs.azure.toolkit.common.lib
    implementation libs.azure.toolkit.appservice.lib
    // The version resolved today, 4.8.4, carries a critical severity vulnerability: below 4.10.6
    // azure-security-keyvault-keys compares authentication tags incorrectly in its local cryptographic
    // verification path, so crafted encrypted input can bypass integrity checks. It reaches us
    // through azure-toolkit-appservice-lib -> azure-resourcemanager-appservice -> azure-resourcemanager-keyvault.
    // Declared explicitly (not as a constraint) so the patched version also reaches consumers of the
    // published POM, since Gradle Module Metadata is disabled for these modules.
    implementation libs.azure.security.keyvault.keys
    implementation libs.azure.toolkit.applicationinsights.lib
    testImplementation libs.junit4
    testImplementation libs.mockito.core

    compileOnly libs.project.lombok
    annotationProcessor libs.project.lombok
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifact sourceJar
            artifact javadocJar
            pom {
                name = projectName
                description = projectDescription
                url = "https://github.com/microsoft/azure-gradle-plugins/tree/master/" + projectShortName
                licenses {
                    license {
                        name = "MIT License"
                        url = "https://opensource.org/licenses/MIT"
                        distribution = "repo"
                    }
                }
                developers {
                    developer {
                        id = "andxu"
                        name = "Andy Xu"
                        email = "andxu@microsoft.com"
                    }

                    developer {
                        id = "Flanker32"
                        name = "Hanxiao Liu"
                        email = "hanli@microsoft.com"
                    }
                }
                scm {
                    connection = "scm:git:https://github.com/microsoft/azure-gradle-plugins"
                    developerConnection = "scm:git:git@github.com:microsoft/azure-gradle-plugins"
                    url = "https://github.com/microsoft/azure-gradle-plugins/tree/master/" + projectShortName
                }
            }
        }
    }
}
