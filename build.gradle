plugins {
    alias(libs.plugins.maven.settings) apply false
    alias(libs.plugins.gradle.plugin.publish) apply false
    alias(libs.plugins.studer.credentials) apply false
    alias(libs.plugins.ben.manes.versions) apply false
    alias(libs.plugins.freefair.aspectj.post.compile.weaving)
}

class PrepareResourceTask extends DefaultTask {
    @Input
    @Optional
    @Option(option = "release", description = "whether this build is a release build.")
    Boolean release;

    @TaskAction
    void prepare() {
        def templateFile = new File(project.projectDir, "src/main/resources/ApplicationInsightsTemplate.xml");
        def targetFile = new File(project.projectDir, "src/main/resources/ApplicationInsights.xml");
        if (templateFile.exists()) {
            targetFile.text = templateFile.text.replaceAll("\\{AI_KEY}",
                    (release != null && release) ? "435bdea7-d399-49ee-8d2d-b2792aa060d2" : "fda156f5-2eb8-48ab-8a3c-3e06b3c64b49")
        }
    }
}

subprojects {
    apply plugin: 'maven-publish'
    apply plugin: 'java'
    apply plugin: 'checkstyle'
    apply plugin: 'project-report'

    // Ensure strict Java 8 bytecode compatibility
    tasks.withType(JavaCompile).configureEach {
        options.release = 8
    }

    checkstyle {
        // Whether or not to allow the build to continue if there are warnings.
        ignoreFailures = false
        // Whether or not rule violations are to be displayed on the console.
        showViolations = true
    }

    repositories {
        mavenLocal()
        mavenCentral()
    }

    // Always use the Groovy version bundled with Gradle.
    configurations.configureEach {
        exclude group: 'org.codehaus.groovy'
    }

    tasks.register('javadocJar', Jar) {
        dependsOn 'javadoc'
        from javadoc.destinationDir
        archiveClassifier = 'javadoc'
    }

    tasks.register('sourceJar', Jar) {
        from sourceSets.main.allJava
        archiveClassifier = "sources"
    }

    // Disable Gradle Module Metadata to avoid JVM version attribute conflicts
    tasks.withType(GenerateModuleMetadata).configureEach {
        enabled = false
    }

    compileJava.doFirst {
        if (targetCompatibility != '1.8') {
            throw new RuntimeException("This project shall be compiled with targetCompatibility = 1.8 " +
                    "but targetCompatibility is actually "
                    + targetCompatibility)
        }
    }
}

configure(subprojects.findAll {it.name != 'azure-gradle-plugins-common'}) {
    apply plugin: 'java-gradle-plugin'
    apply plugin: libs.plugins.gradle.plugin.publish.get().pluginId
    apply plugin: libs.plugins.studer.credentials.get().pluginId

    tasks.register('prepareResources', PrepareResourceTask) {
    }

    tasks.register('prepareReleaseResources', PrepareResourceTask) {
        release = true
    }

    tasks.register('setupPluginPublishSecret') {
        doLast {
            def key = credentials.forKey('gradle.publish.key')
            def secret = credentials.forKey('gradle.publish.secret')
            if (!key || !secret) {
                throw new RuntimeException("gradlePublishKey and/or gradlePublishSecret are not defined")
            }

            System.properties.setProperty("gradle.publish.key", key)
            System.properties.setProperty("gradle.publish.secret", secret)
        }
    }
    tasks.publishPlugins.dependsOn tasks.setupPluginPublishSecret
}
